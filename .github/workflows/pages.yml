name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build public site
        run: python3 build.py

      - name: Refuse emails and phone numbers in dist
        run: |
          python3 - <<'PY'
          import os
          import sys
          from privacy_scan import find_personal_data

          root = "dist"
          if not os.path.isdir(root):
              sys.exit("missing dist/")
          leaked = []
          for dirpath, _dirnames, filenames in os.walk(root):
              for name in filenames:
                  path = os.path.join(dirpath, name)
                  with open(path, encoding="utf-8", errors="replace") as handle:
                      emails, phones = find_personal_data(handle.read())
                  if emails or phones:
                      leaked.append(f"{path}: {len(emails)} emails, {len(phones)} phones")
          if leaked:
              print("\n".join(leaked), file=sys.stderr)
              sys.exit(1)
          print("no emails or phone numbers in dist/")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
